<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Solver | Simple BFS Pathfinding</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Maze Solver</h1>
            <p>Click cells to toggle walls. BFS finds the path.</p>
        </header>

        <div class="controls">
            <button id="solve-btn" class="btn primary">Solve Maze</button>
            <button id="clear-btn" class="btn">Clear Path</button>
            <button id="reset-btn" class="btn danger">Reset All</button>
        </div>

        <div id="grid" class="grid">
        </div>

        <div class="legend">
            <div class="legend-item"><span class="box start"></span> Start</div>
            <div class="legend-item"><span class="box end"></span> End</div>
            <div class="legend-item"><span class="box wall"></span> Wall</div>
            <div class="legend-item"><span class="box path"></span> Path</div>
        </div>

        <div id="status" class="status">Draw walls and click Solve!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
